# Публичная витрина на GitHub Pages. Собирается из файлов репозитория:
# site/index.html, агрегаты site/data/site.json и контуры районов. Базы и
# машины сбора сборке не нужно, поэтому витрина переживает их остановку и
# показывает последнюю дату данных.
#
# Здесь же рисуются обложка README (cover.png) и превью ссылки на витрину
# (social.png): с каждой выгрузкой витрины, из тех же чисел. Закоммиченная
# картинка отставала от текста README на недели.
name: pages

on:
  push:
    branches: [main]
    paths: ["site/**", "sql/geo/**", "src/cover.py", "src/figures.py", "results/drops.json",
            ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Контуры лежат в sql/geo ради карты Metabase. Копия в site/data
      # делается здесь, чтобы не хранить в репозитории второй экземпляр.
      - run: cp sql/geo/moscow_districts.geojson site/data/
      # Снимок разбора снижений нужен превью ссылки: разрыв на нем тот же,
      # что в README и на обложке, а не пересчитанный по витрине.
      - run: cp results/drops.json site/data/
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m src.cover --out site
      # Превью ссылки (site/social.html) и витрина в окне браузера для начала
      # README (site/showcase.html) снимаются Chrome, который на раннере уже
      # стоит. Страницы берут данные через fetch, поэтому нужен сервер.
      - run: |
          (cd site && python -m http.server 8765 >/dev/null 2>&1 &)
          sleep 1
          google-chrome --headless=new --disable-gpu --hide-scrollbars --window-size=1280,640 \
            --virtual-time-budget=15000 --screenshot=site/social.png http://localhost:8765/social.html
          google-chrome --headless=new --disable-gpu --hide-scrollbars --window-size=1400,1180 \
            --force-device-scale-factor=2 --virtual-time-budget=15000 \
            --screenshot=site/showcase.png http://localhost:8765/showcase.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
