# Сторож снаружи машины сбора.
#
# Все остальные проверки живут на самом Mac mini, и если машина зависнет,
# выключится или пропадет сеть, тревогу прислать будет некому. Здесь
# проверка идет на серверах GitHub.
#
# Пульс. Бокс раз в пятнадцать минут перезаписывает ветку heartbeat
# (scripts/box_pulse.sh). Сторож ходит раз в полчаса и пишет в телеграм,
# если отметке больше часа. 29.10.2026 Mac mini завис в 08:15, а прежний
# сторож, сверявший только витрину раз в сутки с порогом 36 часов,
# заметил бы это лишь вечером 30.10, и только письмом на почту.
#
# Чтобы одна беда не слала сообщение каждые полчаса, тревога идет, пока
# отметке от часа до двух с небольшим, а дальше раз в шесть часов.
# Расписание GitHub опаздывает на 5-20 минут, поэтому окно шире часа.
#
# Свежесть витрины. Раз в сутки, в 21:00 по Москве, через полтора часа
# после выгрузки: файл site/data/site.json не старше 36 часов, данные в
# нем не старше двух дней. Это ловит беду, при которой машина жива, а
# обход или выгрузка падают.
#
# Секреты NOTIFY_TG_TOKEN и NOTIFY_TG_CHAT те же, что в .env бокса.
name: watchdog

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Пульс и свежесть
        env:
          TG_TOKEN: ${{ secrets.NOTIFY_TG_TOKEN }}
          TG_CHAT: ${{ secrets.NOTIFY_TG_CHAT }}
          EVENT: ${{ github.event_name }}
          BEAT_LATE_H: ${{ vars.BEAT_LATE_H }}
        run: |
          git fetch -q --depth=1 origin heartbeat || true
          beat=$(git log -1 --format=%ct FETCH_HEAD 2>/dev/null || echo 0)
          python3 .github/watchdog.py "$beat"
