<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Аренда в Москве: витрина в окне</title>
<!-- Картинка для начала README: живая витрина в окне браузера. Снимается
     безголовым Chrome в showcase.png при каждой сборке Pages, как превью,
     поэтому числа на ней те же, что на сайте. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700&display=block" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; }
html, body { width: 1400px; height: 1180px; overflow: hidden; }
body { background: radial-gradient(1200px 700px at 20% 0%, #e4edfb 0%, rgba(228, 237, 251, 0) 60%),
                   radial-gradient(900px 700px at 100% 100%, #e8f1ec 0%, rgba(232, 241, 236, 0) 60%), #f5f7fa;
  font-family: Manrope, sans-serif; }
.win { position: absolute; left: 60px; top: 48px; width: 1280px; height: 1084px; border-radius: 16px;
  background: #fff; overflow: hidden; border: 1px solid rgba(15, 23, 42, .08);
  box-shadow: 0 30px 70px rgba(15, 23, 42, .16), 0 8px 20px rgba(15, 23, 42, .06); }
.bar { height: 46px; display: flex; align-items: center; gap: 8px; padding: 0 18px;
  background: #f3f4f6; border-bottom: 1px solid #e5e7eb; }
.bar i { width: 12px; height: 12px; border-radius: 50%; display: block; }
.url { margin-left: 18px; flex: 0 1 520px; height: 28px; border-radius: 8px; background: #fff;
  border: 1px solid #e5e7eb; display: flex; align-items: center; padding: 0 12px;
  font-size: 14px; color: #475569; font-weight: 500; }
.url b { color: #0f172a; font-weight: 700; }
iframe { display: block; width: 1280px; height: 1038px; border: 0; }
/* Картинка в README ведет на сайт, но сама по себе на ссылку не похожа:
   низ окна уходит в дымку, поверх кнопка, как у живой страницы. */
.fade { position: absolute; left: 0; right: 0; bottom: 0; height: 260px; pointer-events: none;
  background: linear-gradient(rgba(255, 255, 255, 0), rgba(255, 255, 255, .92) 62%, #fff); }
.cta { position: absolute; left: 50%; bottom: 64px; transform: translateX(-50%);
  display: flex; align-items: center; gap: 14px; padding: 20px 34px 20px 38px; border-radius: 999px;
  background: #0f172a; color: #fff; font-size: 26px; font-weight: 700; white-space: nowrap;
  box-shadow: 0 14px 34px rgba(15, 23, 42, .28), 0 3px 8px rgba(15, 23, 42, .18); }
.cta svg { width: 26px; height: 26px; }
</style>
</head>
<body>
<div class="win">
  <div class="bar"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i>
    <div class="url"><b>nata2627.github.io</b>/msk-rent-market</div></div>
  <iframe id="f" src="index.html#%D0%A5%D0%B0%D0%BC%D0%BE%D0%B2%D0%BD%D0%B8%D0%BA%D0%B8" title="Витрина"></iframe>
  <div class="fade"></div>
  <div class="cta">Открыть живую витрину
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg></div>
</div>
<script>
// В окно должны войти плитки, карта и карточка района: вводный абзац и
// плашка даты прячутся, страница слегка уменьшается. До отрисовки карты,
// потому что ее размер считается от ширины колонки.
const f = document.getElementById("f");
// Ждем, пока страница внутри соберет плитки: событие load у iframe в
// безголовом Chrome иногда приходит раньше, чем на него подпишешься.
const t = setInterval(() => {
  const d = f.contentDocument;
  if (!d || !d.querySelector("#kpis .kpi")) return;
  clearInterval(t);
  d.head.insertAdjacentHTML("beforeend",
    "<style>body{zoom:.86} .lead, #date, #mapintro, #mapnote{display:none} main{padding-top:30px}</style>");
}, 50);
</script>
</body>
</html>
