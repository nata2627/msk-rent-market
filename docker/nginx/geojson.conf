# Расширения .geojson в стандартном mime.types нет, и nginx отдаёт такой
# файл как application/octet-stream. Metabase принимает свои карты только
# с JSON-типом и на октет-стрим отвечает «GeoJSON URL returned invalid
# content-type» — карта висит в бесконечной загрузке.
types {
    application/geo+json  geojson;
    application/json      json;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    charset utf-8;

    location / {
        add_header Access-Control-Allow-Origin *;
        try_files $uri =404;
    }
}
